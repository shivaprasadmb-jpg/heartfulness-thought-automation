name: Generate and Email Daily Heartfulness Thought

on:
  schedule:
    # 23:30 UTC = 04:00 AM IST (every morning)
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  run-dispatch-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run image generator and email dispatcher
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
        run: python generate_and_email.py
