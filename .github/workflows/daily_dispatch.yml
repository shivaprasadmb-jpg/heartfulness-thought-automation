name: Generate and Email Daily Heartfulness Thought

on:
  schedule:
    # 23:00 UTC = 04:30 AM IST (Every morning, well ahead of the 5:55 AM broadcast)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system fonts for Kannada & English typography
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-taml fonts-knda fonts-deva ttf-mscorefonts-installer fontconfig
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script to generate card and email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
        run: |
          python generate_and_email.py
