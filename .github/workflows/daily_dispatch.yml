# === SAVE THIS AS .github/workflows/daily_dispatch.yml ===
name: Generate and Email Daily Heartfulness Thought

on:
  schedule:
    # Runs at 00:00 UTC (05:30 IST) every morning
    - cron: '0 0 * * *'
  workflow_dispatch: # This adds a manual 'Run' button for testing

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run image generator and email dispatcher
        env:
          # Securely map the cloud secrets to environment variables
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
        run: python generate_and_email.py
